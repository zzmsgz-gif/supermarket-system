# ============================================================
# 云端（Railway / 生产）配置 —— 本文件已提交进仓库，不含任何真实密钥。
# 激活方式：设置环境变量 SPRING_PROFILES_ACTIVE=prod
# 所有敏感项均通过环境变量注入，默认值仅用于本地/兜底。
# ============================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: supermarket-backend
  datasource:
    # Railway 上设置 SPRING_DATASOURCE_URL 为完整 JDBC 串（由 MySQL 服务的私有变量拼出）。
    # ⚠️ DB_PASSWORD 刻意不给默认值：本文件会被提交，写上真实口令等于把密码公开
    # （此仓库是公开仓库，历史上就这样泄露过本机 MySQL 口令，已清理）。
    # 本地要跑 prod profile 时请先 export DB_PASSWORD。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supermarket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 云端首次部署数据库为空，用 update 让 Hibernate 自动建表；
      # 表结构稳定后可设环境变量 SPRING_JPA_HIBERNATE_DDL_AUTO=validate 收紧。
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    generate-ddl: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 120MB

logging:
  level:
    org.hibernate.SQL: warn

# 文件存储配置
# 【2026-11-20 彻底移除 OSS】OSS 已按用户要求停用（欠费 + 避免继续产生费用），
# 依赖、实现类、配置块全部删除；StorageConfig 不再读 storage.type，只剩本地磁盘。
# 即使环境变量残留 STORAGE_TYPE=oss / OSS_*，也不会实例化任何云端存储客户端。
# 恢复 OSS 需重新加依赖 + 实现类 + 配置，且必须先取得用户明确同意。
storage:
  local:
    dir: ${STORAGE_LOCAL_DIR:./uploads}

# JWT / 业务参数：均读取环境变量，带安全兜底默认值
app:
  jwt:
    # 默认值为强随机串，确保即使忘记设置也能启动；生产务必用环境变量 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:tZS5KaXPu2fSadCHjBkPT6Y96IUCu0SdTfeTt_795CPfcQTiwFK_LP1LOaJdYzEs}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    # 勾了「记住我」的有效期（默认 7 天 = 604800 秒）
    remember-expiration-seconds: ${JWT_REMEMBER_EXPIRATION_SECONDS:604800}
  order:
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:30}
    close-check-interval-ms: ${ORDER_CLOSE_CHECK_INTERVAL_MS:60000}
  new-user-coupon-id: ${APP_NEW_USER_COUPON_ID:5}
  # 云端空库首次部署的「引导管理员」：把该用户名提升/创建为 ADMIN，之后可移除这两个变量。
  bootstrap:
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  # 进程内 Caffeine 缓存：默认开启（无需 Redis 等外部进程）。设 APP_CACHE_ENABLED=false 可整体关闭。
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
  idempotency:
    ttl-seconds: ${APP_IDEMPOTENCY_TTL_SECONDS:300}
