# 超市系统 - 带域名的 HTTPS 站点配置（Alibaba Cloud Linux 3 / RHEL 系）
# 域名：haomart.xyz（含 www 子域名），香港 ECS 8.218.154.150，免备案
# 证书：acme.sh 签发的 Let's Encrypt 免费证书，存放 /root/.acme.sh/haomart.xyz_ecc/
#
# 部署步骤：
#   1) 域名 A 记录（@ 与 www）已指向 8.218.154.150，安全组 80/443 已开放
#   2) acme.sh 签发：acme.sh --issue -d haomart.xyz -d www.haomart.xyz --webroot /var/www/supermarket
#   3) 本文件 cp 到 /etc/nginx/conf.d/ 并 reload：nginx -t && systemctl reload nginx

# ============================================================
# Gzip 压缩（http 级，覆盖本文件所有 server）
# 前端构建产物 index-*.js / *.css 是纯文本，gzip 后传输量约 1/3
# 注意：jpg/png/webp 等已压缩的图片不在此列（再加 gzip 无意义且浪费 CPU）
# ============================================================
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ---- HTTP : 80 端口：只做两件事 —— ACME 验证 + 301 跳 https ----
server {
    listen 80;
    listen [::]:80;
    server_name haomart.xyz www.haomart.xyz;

    # Let's Encrypt 签发时的 http-01 验证目录（acme.sh --webroot 把文件写到这里）
    # 注意：root 必须是 webroot 本身，这样 /.well-known/acme-challenge/xxx
    #      才会映射到 /var/www/supermarket/.well-known/acme-challenge/xxx
    location /.well-known/acme-challenge/ {
        root /var/www/supermarket;
    }

    # 其余请求全部 301 跳转到 https（强制加密）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS : 443 端口：真实站点 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haomart.xyz www.haomart.xyz;

    # acme.sh v3 的 ECC 证书存放在 <域名>_ecc/ 目录（签发后自动生成；renew 时自动更新这两个文件）
    ssl_certificate     /root/.acme.sh/haomart.xyz_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/haomart.xyz_ecc/haomart.xyz.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 前端静态资源根目录（publish.sh 把 frontend/dist/* 传到这）
    root /var/www/supermarket;
    index index.html;

    # 上传图片等请求体上限（与后端 max-file-size 12MB 匹配）
    client_max_body_size 20m;

    # HSTS（可选，开一年后浏览器强制 https；确定长期用 https 再加）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 上传图片直出：由 nginx 直接读磁盘返回，不再占用 Tomcat 线程，并加长期缓存头
    # 放在 /api 反代之前，前缀更长优先命中
    location /api/uploads/ {
        alias /opt/supermarket/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 后端 API：同源反代（注意 proxy 走 http 到本地 8080）
    location /api {
        # 接口限流：引用 rate-limit.conf 的 api_perip zone
        limit_req zone=api_perip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 种子商品配图：构建产物（dist/seed-products），内容随发版更新，长期缓存
    # 与 /api/uploads 同策略；文件名不带 hash，靠发版覆盖
    location /seed-products/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
