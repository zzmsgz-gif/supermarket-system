# 超市系统 - 带域名的 HTTPS 站点配置（Alibaba Cloud Linux 3 / RHEL 系）
# 域名：haomart.xyz（含 www 子域名），香港 ECS 8.218.154.150，免备案
# 证书：acme.sh 签发的 Let's Encrypt 免费证书，存放 /root/.acme.sh/haomart.xyz_ecc/
#
# 部署步骤：
#   1) 域名 A 记录（@ 与 www）已指向 8.218.154.150，安全组 80/443 已开放
#   2) acme.sh 签发：acme.sh --issue -d haomart.xyz -d www.haomart.xyz --webroot /var/www/supermarket
#   3) 本文件 cp 到 /etc/nginx/conf.d/ 并 reload：nginx -t && systemctl reload nginx

# ============================================================
# Gzip 压缩（http 级，覆盖本文件所有 server）
# 前端构建产物 index-*.js / *.css 是纯文本，gzip 后传输量约 1/3
# 注意：jpg/png/webp 等已压缩的图片不在此列（再加 gzip 无意义且浪费 CPU）
# ============================================================
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ---- HTTP : 80 端口：只做两件事 —— ACME 验证 + 301 跳 https ----
server {
    listen 80;
    listen [::]:80;
    server_name haomart.xyz www.haomart.xyz;

    # Let's Encrypt 签发时的 http-01 验证目录（acme.sh --webroot 把文件写到这里）
    # 注意：root 必须是 webroot 本身，这样 /.well-known/acme-challenge/xxx
    #      才会映射到 /var/www/supermarket/.well-known/acme-challenge/xxx
    location /.well-known/acme-challenge/ {
        root /var/www/supermarket;
    }

    # 其余请求全部 301 跳转到 https（强制加密）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS : 443 端口：真实站点 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haomart.xyz www.haomart.xyz;

    # acme.sh v3 的 ECC 证书存放在 <域名>_ecc/ 目录（签发后自动生成；renew 时自动更新这两个文件）
    ssl_certificate     /root/.acme.sh/haomart.xyz_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/haomart.xyz_ecc/haomart.xyz.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 前端静态资源根目录（publish.sh 把 frontend/dist/* 传到这）
    root /var/www/supermarket;
    index index.html;

    # 上传图片等请求体上限（与后端 max-file-size 12MB 匹配）
    client_max_body_size 20m;

    # 限流拒绝统一返回 429（默认是 503）。配合下面 error_page 429 把它渲染成 JSON。
    limit_req_status 429;

    # 限流命中时不再返回 nginx 默认 HTML 错误页，而是渲染成统一的 JSON 错误体，
    # 并带 Retry-After，前端 client.js 专门识别 429 走「请求过于频繁」文案、可优雅退避。
    error_page 429 @rate_limited;

    # HSTS（可选，开一年后浏览器强制 https；确定长期用 https 再加）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ===== 小程序版 H5（miniprogram 用 uni-app build:h5 出的包）=====
    # 为什么挂同域子路径而不是 Vercel/GitHub Pages：
    #   1) H5 包里 config.js 的 API_BASE 是相对路径 '/api'，只有同源才能直接打到后端；
    #      丢到第三方静态托管会 404（没 proxy），改直连又会被 CORS 拦（本文件没开 CORS 头）。
    #   2) 商品图是 '/api/uploads/...'、种子图是 '/seed-products/...'，都按域名根解析，
    #      子路径部署时天然命中现有 location，零改动。
    # 注意：这里**不用 alias**（alias + try_files 会把 $uri 重复拼接），直接用 server 级 root。
    # 用 hash 路由（manifest.json h5.router.base=/m/），所以只需要 index.html 回落。
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # H5 包的 assets 带内容 hash，可长缓存；index.html 必须 no-cache，否则发版后拿到旧入口
    location /m/assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /m/index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 上传图片直出：由 nginx 直接读磁盘返回，不再占用 Tomcat 线程，并加长期缓存头
    # 放在 /api 反代之前，前缀更长优先命中
    location /api/uploads/ {
        alias /opt/supermarket/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 后端 API：同源反代（注意 proxy 走 http 到本地 8080）
    location /api {
        # 接口限流：引用 rate-limit.conf 的 api_perip zone
        # burst=60 要能容下后台首屏的 33 个并发请求（见 rate-limit.conf 里的说明）
        limit_req zone=api_perip burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 秒杀列表：公开高频只读接口，走 nginx 层短缓存（见 rate-limit.conf 的 flash_cache），
    # 2s 缓存即可削平洪峰、少打后端，对秒杀列表数据延迟无感。精确匹配，带 query string 仍命中。
    location = /api/flash-sales {
        proxy_cache flash_cache;
        proxy_cache_valid 200 2s;
        # 后端对 API 统一回了 no-cache/no-store，nginx 默认不缓存这类响应，
        # 这里显式忽略上游的缓存控制头，强制按 2s 缓存（秒杀列表延迟 2s 完全无感）。
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 下单 / 立即购买：从全局 api_perip 拆出来，走 order_peruser zone（按 IP+token≈按用户限），
    # 防止脚本批量下单 / 重复提交挤占普通浏览的限流桶。5r/s+burst=10 足够人类操作。
    # 正则只匹配创建订单（POST /api/orders）与立即购买（POST /api/orders/quick-buy），
    # 不匹配 /api/orders/123 这类详情/操作接口，它们仍走上面的 /api 全局桶。
    location ~ ^/api/orders(/quick-buy)?$ {
        limit_req zone=order_peruser burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 种子商品配图：构建产物（dist/seed-products），内容随发版更新，长期缓存
    # 与 /api/uploads 同策略；文件名不带 hash，靠发版覆盖
    location /seed-products/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 限流命中（429）的统一错误体：JSON + Retry-After，替代 nginx 默认 HTML 页。
    # 前端 client.js 识别 429 走专门文案，不会再把 HTML 当 JSON 解析而崩。
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }
}
