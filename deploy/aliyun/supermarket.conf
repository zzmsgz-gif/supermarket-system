# 超市系统 - nginx 站点配置（Alibaba Cloud Linux 3 / RHEL 系）
# 用法（RHEL 系没有 sites-available/sites-enabled，直接放 conf.d）：
#   sudo cp supermarket.conf /etc/nginx/conf.d/supermarket.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前端 dist 与后端 :8080 在同一域名下（同源，前端无需 CORS 配置）：
#   http://服务器IP/       -> nginx 返回 dist 静态文件
#   http://服务器IP/api/*  -> 反代到 127.0.0.1:8080（后端 context-path 也是 /api）
#   http://服务器IP/api/uploads/* -> 由后端读本地磁盘返回（STORAGE_LOCAL_DIR）

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 暂用 IP 访问；有域名后改成你的域名（香港地域免备案，可直接解析）

    # 前端静态资源根目录（publish.sh 会把 frontend/dist/* 传到这里）
    root /var/www/supermarket;
    index index.html;

    # 上传图片等请求体上限（与后端 max-file-size 12MB 匹配，留余量）
    client_max_body_size 20m;

    # SPA history 模式回退（Vue Router history 必需，否则刷新子路由 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：同源反代
    location /api {
        # 接口限流：引用 rate-limit.conf 的 api_perip zone
        # burst=60 要能容下后台首屏的 33 个并发请求（见 rate-limit.conf 里的说明）
        limit_req zone=api_perip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 带 hash 的构建产物可长期缓存；index.html 不缓存，保证发布后即时生效
    # 种子商品配图：构建产物，长期缓存
    location /seed-products/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
