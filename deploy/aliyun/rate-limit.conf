# 接口限流：保护后端 :8080，按客户端 IP 限流
# 单机小流量超市应用：30 req/s，允许突发 60 立即通过，超出返回 429
#
# ⚠️ 别再调回 10r/s + burst=20（2026-10-04 修）：那是按「单页几个请求」估的，但 SPA 是**并发**拉数据。
# 实测打开 /admin 首屏一次就发 33 个请求（categories / products / orders / refunds / stock /
# coupons / activities / hot-searches / banners / overview …），burst=20 直接把其中 9 个打成 429 ——
# 前端 JSON.parse 报 `Unexpected token '<'`，侧栏角标与列表悄悄变空，看起来像「后台坏了」。
# 这不是部署故障，是限流阈值与前端请求量不匹配。
# 30r/s + burst=60 能容下一次完整后台首屏（33 个请求），同时仍挡住脚本洪泛。
limit_req_zone $binary_remote_addr zone=api_perip:10m rate=30r/s;
