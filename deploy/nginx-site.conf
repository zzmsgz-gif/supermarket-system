# 超市系统 - 生产站点配置（nginx）
# 用法：
#   sudo cp nginx-site.conf /etc/nginx/sites-available/supermarket
#   sudo ln -sf /etc/nginx/sites-available/supermarket /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前端（vite build 产物）与后端（Spring Boot :8080）在同一域名下：
#   浏览器访问 http://服务器IP  ->  nginx 返回 dist 静态文件
#   前端相对路径 /api/*          ->  nginx 反代到 127.0.0.1:8080（后端 context-path 也是 /api）
# 因为是同源，前端无需任何 CORS 配置，也无需改代码。

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 暂用 IP 访问；有域名后改成你的域名（如 shop.example.com）

    # 前端静态资源根目录（publish.sh 会把 frontend/dist/* 传到这里）
    root /var/www/supermarket;
    index index.html;

    # 上传图片等请求体上限
    client_max_body_size 20m;

    # SPA history 模式回退（Vue Router 用 history 模式时需要；hash 模式也无妨）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：同域名反代，/api 即同源
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
